<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Nova Strike</title>
  <style>
    html,body{margin:0;height:100%;background:#020617;overflow:hidden;touch-action:none;font-family:"Segoe UI",system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #ui{position:fixed;inset:0;pointer-events:none;color:#fff}
    #score{position:absolute;top:16px;left:18px;font-size:clamp(22px,5vw,36px);font-weight:800;text-shadow:0 0 18px #22d3ee}
    #ctrl{position:absolute;top:18px;right:16px;opacity:.7;font-size:13px;text-align:right}
    #start,#over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(8,47,73,.4),rgba(2,6,23,.85))}
    #over{display:none} #over.show{display:grid} #start.hide{display:none}
    .box{text-align:center;padding:20px}
    h1{margin:0 0 8px;font-size:clamp(32px,8vw,52px);background:linear-gradient(90deg,#67e8f9,#a78bfa);-webkit-background-clip:text;color:transparent}
    p{opacity:.85;max-width:440px;margin:0 auto 18px;line-height:1.45}
    button{border:0;border-radius:999px;padding:14px 32px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(90deg,#22d3ee,#7c3aed);cursor:pointer}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">0</div>
  <div id="ctrl">A D / ← → / Drag</div>
  <div id="start"><div class="box">
    <h1>NOVA STRIKE</h1>
    <p>კომპი: მაუსი ან A/D. ტელეფონი: გაასრიალე თითი. ხომალდი ავტომატურად ისვრის.</p>
    <button id="go">თამაში</button>
  </div></div>
  <div id="over"><div class="box">
    <h1>GAME OVER</h1>
    <p id="final"></p>
    <button id="again">კიდევ</button>
  </div></div>
</div>
<script>
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"), startEl=document.getElementById("start");
const overEl=document.getElementById("over"), finalEl=document.getElementById("final");
let W,H,dpr,px,py,keys,bullets,foes,parts,stars,score,best,live,started,cool,t;
best=+localStorage.getItem("rb_nova")||0;
const actx=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d,type="square"){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.stop(actx.currentTime+d);}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.width=innerWidth*dpr;H=canvas.height=innerHeight*dpr;py=H*.8;px=W/2;}
function reset(){live=true;started=true;score=0;t=0;cool=0;px=W/2;bullets=[];foes=[];parts=[];stars=[...Array(90)].map(()=>({x:Math.random()*W,y:Math.random()*H,z:.4+Math.random()}));scoreEl.textContent="0";overEl.classList.remove("show");startEl.classList.add("hide");}
function boom(x,y){for(let i=0;i<16;i++)parts.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:1,c:Math.random()>.5?"#67e8f9":"#f0abfc"});}
function die(){if(!live)return;live=false;beep(70,.35,"sawtooth");best=Math.max(best,score);localStorage.setItem("rb_nova",best);finalEl.textContent=`ქულა ${score}  ·  რეკორდი ${best}`;overEl.classList.add("show");}
function loop(){
  t++;
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#020617"); bg.addColorStop(1,"#1e1b4b");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.y+=s.z*3; if(s.y>H){s.y=0;s.x=Math.random()*W;} ctx.fillStyle=`rgba(186,230,253,${.2+s.z*.5})`; ctx.fillRect(s.x,s.y,s.z*2.2,s.z*6);});
  if(live&&started){
    if(keys.left) px-=W*.012; if(keys.right) px+=W*.012;
    px=Math.max(30,Math.min(W-30,px));
    cool--; if(cool<=0){ bullets.push({x:px,y:py-24,v:H*.02}); cool=8; beep(980,.03,"triangle"); }
    if(t%32===0) foes.push({x:40+Math.random()*(W-80),y:-40,s:20+Math.random()*18,v:2.2+score*.035, w:Math.random()>.7?2:1});
  }
  bullets.forEach(b=>b.y-=b.v);
  bullets=bullets.filter(b=>b.y>-30);
  ctx.shadowBlur=16; ctx.shadowColor="#22d3ee"; ctx.fillStyle="#a5f3fc";
  bullets.forEach(b=>{ctx.fillRect(b.x-3,b.y,6,18);});
  ctx.shadowBlur=0;
  foes.forEach(f=>{
    if(live&&started) f.y+=f.v;
    ctx.save(); ctx.translate(f.x,f.y);
    ctx.shadowBlur=22; ctx.shadowColor="#fb7185";
    ctx.fillStyle=f.w===2?"#c084fc":"#fb7185";
    ctx.beginPath(); ctx.moveTo(0,f.s); ctx.lineTo(-f.s*.75,-f.s*.45); ctx.lineTo(0,-f.s*.15); ctx.lineTo(f.s*.75,-f.s*.45); ctx.fill();
    ctx.restore();
    if(f.y>H-8) die();
    bullets.forEach(b=>{ if(Math.hypot(b.x-f.x,b.y-f.y)<f.s){ f.dead=1; b.y=-99; boom(f.x,f.y); score+=f.w*10; scoreEl.textContent=score; beep(420,.06); }});
    if(Math.hypot(px-f.x,py-f.y)<f.s+20) die();
  });
  foes=foes.filter(f=>!f.dead && f.y<H+50);
  parts=parts.filter(p=>(p.life-=.04)>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5);ctx.globalAlpha=1;});
  if(started){
    ctx.save(); ctx.translate(px,py);
    ctx.shadowColor="#22d3ee"; ctx.shadowBlur=28;
    ctx.fillStyle="#67e8f9"; ctx.beginPath(); ctx.moveTo(0,-28); ctx.lineTo(20,18); ctx.lineTo(0,8); ctx.lineTo(-20,18); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(8,8); ctx.lineTo(-8,8); ctx.fill();
    ctx.fillStyle="#f472b6"; ctx.globalAlpha=.8; ctx.fillRect(-4,16,8,10+Math.sin(t/2)*4);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
keys={left:false,right:false};
resize(); stars=[...Array(90)].map(()=>({x:Math.random()*W,y:Math.random()*H,z:.4+Math.random()})); loop();
addEventListener("resize", resize);
addEventListener("keydown", e=>{ if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=true; if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=true; if(e.code==="Space"&&!started){actx.resume();reset();} });
addEventListener("keyup", e=>{ if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=false; if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=false; });
addEventListener("pointerdown", e=>{ actx.resume(); if(!started) reset(); px=e.clientX*dpr; }, {passive:true});
addEventListener("pointermove", e=>{ if(e.buttons||e.pointerType==="touch") px=Math.max(30,Math.min(W-30,e.clientX*dpr)); }, {passive:true});
document.getElementById("go").onclick=()=>{actx.resume();reset();};
document.getElementById("again").onclick=reset;
</script>
</body>
</html>
