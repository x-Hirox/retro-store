<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Star Lance</title>
  <style>
    html,body{margin:0;height:100%;background:#050816;overflow:hidden;touch-action:none;font-family:Tahoma,sans-serif}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    #hud{position:fixed;inset:0;pointer-events:none;color:#fff}
    #score{position:absolute;top:10px;left:12px;font-weight:800;text-shadow:0 2px 0 #000}
    #pad{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;padding:0 12px;pointer-events:auto}
    .pb{width:56px;height:56px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;font-weight:800}
    .pb.on{background:#38bdf8}
    #start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);pointer-events:auto}
    #start.hide{display:none}
    .box{text-align:center;max-width:440px;padding:16px}
    h1{margin:0 0 8px;color:#7dd3fc;letter-spacing:2px}
    button.go{border:0;border-radius:10px;padding:12px 28px;font-weight:800;background:#38bdf8;color:#041018;cursor:pointer}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="score">SCORE 0</div>
  <div id="pad">
    <div>
      <button class="pb" data-k="l">◀</button>
      <button class="pb" data-k="r">▶</button>
    </div>
    <button class="pb" data-k="a">A</button>
  </div>
  <div id="start"><div class="box">
    <h1>STAR LANCE</h1>
    <p>16-bit სტილის კოსმოსური შმაპი. კომპი: ← → და Z/Space. ტელეფონი: ◀ ▶ და A.</p>
    <button class="go" id="go">START</button>
  </div></div>
</div>
<script>
const C=document.getElementById("c"), ctx=C.getContext("2d");
const W=320,H=180; C.width=W; C.height=H;
let keys={}, started=false, t=0, score=0, ship={x:160,y:150}, shots=[], foes=[], stars=[], boom=[];
for(let i=0;i<70;i++) stars.push({x:Math.random()*W,y:Math.random()*H,z:0.4+Math.random()*2,c:Math.random()>.7?"#7dd3fc":"#fff"});
function spawn(){
  foes.push({x:20+Math.random()*280,y:-12,s:0.6+Math.random()*1.2,hp:2,w:14,kind:Math.random()>.78?2:1});
}
function loop(){
  t++;
  ctx.fillStyle="#07111f"; ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#12203a"); g.addColorStop(1,"#071018");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ s.y+=s.z; if(s.y>H) s.y=0; ctx.fillStyle=s.c; ctx.fillRect(s.x,s.y,s.z,s.z); });
  if(started){
    if(keys.l) ship.x-=2.4; if(keys.r) ship.x+=2.4;
    ship.x=Math.max(10,Math.min(W-10,ship.x));
    if((keys.a||keys.z)&& t%8===0) shots.push({x:ship.x,y:ship.y-8});
    if(t%42===0) spawn();
    shots.forEach(s=>s.y-=5);
    shots=shots.filter(s=>s.y>-8);
    foes.forEach(f=>{ f.y+=f.s; f.x+=Math.sin((t+f.x)*0.04)*0.6; });
    foes=foes.filter(f=>f.y<H+20 && f.hp>0);
    shots.forEach(s=>{
      foes.forEach(f=>{
        if(Math.abs(s.x-f.x)<f.w && Math.abs(s.y-f.y)<10){ f.hp--; s.y=-99; score+=50*f.kind; boom.push({x:f.x,y:f.y,n:8}); }
      });
    });
    ctx.fillStyle="#38bdf8"; shots.forEach(s=>{ ctx.fillRect(s.x-1,s.y,2,8); ctx.fillStyle="#e0f2fe"; ctx.fillRect(s.x-1,s.y,2,3); ctx.fillStyle="#38bdf8"; });
    foes.forEach(f=>{
      ctx.fillStyle=f.kind===2?"#f97316":"#fb7185";
      ctx.beginPath(); ctx.moveTo(f.x,f.y+10); ctx.lineTo(f.x-12,f.y-6); ctx.lineTo(f.x+12,f.y-6); ctx.fill();
      ctx.fillStyle="#0f172a"; ctx.fillRect(f.x-3,f.y-2,6,4);
    });
    boom=boom.filter(b=>b.n-->0);
    boom.forEach(b=>{ ctx.fillStyle="#fde68a"; ctx.fillRect(b.x+(Math.random()*12-6),b.y+(Math.random()*12-6),3,3); });
    ctx.fillStyle="#94a3b8"; ctx.beginPath(); ctx.moveTo(ship.x,ship.y-14); ctx.lineTo(ship.x-12,ship.y+10); ctx.lineTo(ship.x+12,ship.y+10); ctx.fill();
    ctx.fillStyle="#38bdf8"; ctx.fillRect(ship.x-3,ship.y-4,6,10);
    ctx.fillStyle="#f97316"; ctx.fillRect(ship.x-2,ship.y+10,4,6);
    document.getElementById("score").textContent="SCORE "+score;
  }
  requestAnimationFrame(loop);
}
loop();
addEventListener("keydown",e=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.l=true;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.r=true;
  if(e.code==="KeyZ"||e.code==="Space"||e.code==="ShiftLeft") keys.a=true;
});
addEventListener("keyup",e=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.l=false;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.r=false;
  if(e.code==="KeyZ"||e.code==="Space"||e.code==="ShiftLeft") keys.a=false;
});
document.querySelectorAll(".pb").forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener("pointerdown",e=>{e.preventDefault(); keys[k]=true; b.classList.add("on");});
  b.addEventListener("pointerup",()=>{ keys[k]=false; b.classList.remove("on");});
  b.addEventListener("pointercancel",()=>{ keys[k]=false; b.classList.remove("on");});
});
document.getElementById("go").onclick=()=>{ started=true; document.getElementById("start").classList.add("hide"); };
</script>
</body>
</html>
