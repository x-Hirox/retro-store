<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Volt Glide</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070014; overflow: hidden; touch-action: none; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; }
    #score { position: absolute; top: 16px; left: 18px; font-size: clamp(22px, 5vw, 36px); font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 22px #c084fc; }
    #ctrl { position: absolute; top: 18px; right: 16px; opacity: .7; font-size: 13px; text-align: right; }
    #over, #start { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: auto; background: radial-gradient(ellipse at center, rgba(88,28,135,.35), rgba(7,0,20,.82)); }
    #over { display: none; }
    #over.show { display: grid; }
    #start.hide { display: none; }
    .box { text-align: center; padding: 20px; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 8vw, 52px); background: linear-gradient(90deg,#e9d5ff,#22d3ee); -webkit-background-clip: text; color: transparent; }
    p { opacity: .85; max-width: 420px; margin: 0 auto 18px; line-height: 1.45; }
    button { pointer-events: auto; border: 0; border-radius: 999px; padding: 14px 32px; font-size: 17px; font-weight: 800; color: #fff; background: linear-gradient(90deg,#a855f7,#ec4899); box-shadow: 0 10px 30px rgba(168,85,247,.45); cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">0</div>
  <div id="ctrl">Space / Click / Tap</div>
  <div id="start"><div class="box">
    <h1>VOLT GLIDE</h1>
    <p>კომპი: Space ან მაუსის კლიკი. ტელეფონი: შეეხე ეკრანს. გაიარე ნეონ რგოლების ცენტრში.</p>
    <button id="go">თამაში</button>
  </div></div>
  <div id="over"><div class="box">
    <h1>GAME OVER</h1>
    <p id="final"></p>
    <button id="again">კიდევ</button>
  </div></div>
</div>
<script>
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score"), startEl = document.getElementById("start");
const overEl = document.getElementById("over"), finalEl = document.getElementById("final");
let W,H,dpr,y,vy,rings,sparks,stars,score,best,live,started,shake,t;
best = +localStorage.getItem("rb_volt")||0;
const actx = new (window.AudioContext||window.webkitAudioContext)();
function beep(f, d, type="sine") {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = 0.04;
  o.connect(g); g.connect(actx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d); o.stop(actx.currentTime + d);
}
function resize(){ dpr=Math.min(devicePixelRatio||1,2); W=canvas.width=innerWidth*dpr; H=canvas.height=innerHeight*dpr; }
function reset(){
  live=true; started=true; y=H*0.5; vy=0; score=0; t=0; shake=0; rings=[]; sparks=[];
  stars=[...Array(80)].map(()=>({x:Math.random()*W,y:Math.random()*H,z:0.3+Math.random()}));
  for(let i=0;i<5;i++) spawn(W*0.5+i*W*0.38);
  scoreEl.textContent="0"; overEl.classList.remove("show"); startEl.classList.add("hide");
}
function spawn(x){ rings.push({x, r: H*(0.13+Math.random()*0.05), gy:H*(0.32+Math.random()*0.36), hit:false, hue: 270+Math.random()*80}); }
function boost(){
  if(!started){ actx.resume(); reset(); return; }
  if(!live) return;
  vy = -H*0.0115; shake=6; beep(520,.07,"triangle");
  for(let i=0;i<12;i++) sparks.push({x:W*0.3,y,vx:-3-Math.random()*5,vy:(Math.random()-.5)*5,life:1});
}
function die(){
  if(!live) return; live=false; shake=18; beep(90,.3,"sawtooth");
  best=Math.max(best,score); localStorage.setItem("rb_volt",best);
  finalEl.textContent=`ქულა ${score}  ·  რეკორდი ${best}`; overEl.classList.add("show");
}
function loop(){
  t++; if(shake>0) shake*=0.86;
  const ox=(Math.random()-.5)*shake, oy=(Math.random()-.5)*shake;
  ctx.setTransform(1,0,0,1,ox,oy);
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#14002b"); bg.addColorStop(1,"#050014");
  ctx.fillStyle=bg; ctx.fillRect(-20,-20,W+40,H+40);
  stars.forEach(s=>{ s.x-=s.z*3; if(s.x<0)s.x=W; ctx.fillStyle=`rgba(255,255,255,${.15+s.z*.4})`; ctx.fillRect(s.x,s.y,s.z*2.5,s.z*2.5); });
  if(live && started){ vy+=H*0.00026; y+=vy; if(y<30||y>H-30) die(); }
  const speed=W*0.007+score*0.09;
  rings.forEach(r=>{
    if(live&&started) r.x-=speed;
    const glow=ctx.createRadialGradient(r.x,r.gy,r.r*0.2,r.x,r.gy,r.r*1.4);
    glow.addColorStop(0,`hsla(${r.hue},100%,60%,.18)`); glow.addColorStop(1,"transparent");
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(r.x,r.gy,r.r*1.4,0,7); ctx.fill();
    ctx.lineWidth=12*dpr; ctx.strokeStyle=`hsl(${r.hue},100%,70%)`; ctx.shadowColor=`hsl(${r.hue},100%,60%)`; ctx.shadowBlur=28;
    ctx.beginPath(); ctx.ellipse(r.x,r.gy,r.r,r.r*0.72,0,0,7); ctx.stroke();
    ctx.lineWidth=5*dpr; ctx.strokeStyle="#67e8f9"; ctx.beginPath(); ctx.ellipse(r.x,r.gy,r.r*0.62,r.r*0.44,0,0,7); ctx.stroke();
    ctx.shadowBlur=0;
    if(live && !r.hit && r.x<W*0.3){
      const dx=(W*0.3-r.x)/r.r, dy=(y-r.gy)/(r.r*0.72);
      if(dx*dx+dy*dy>1) die(); else { r.hit=true; score++; scoreEl.textContent=score; beep(880,.05); }
    }
  });
  rings=rings.filter(r=>r.x>-120);
  if(started && rings.at(-1)?.x<W*0.72) spawn(W+100);
  sparks=sparks.filter(s=>(s.life-=.045)>0);
  sparks.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; ctx.globalAlpha=s.life; ctx.fillStyle="#f0abfc"; ctx.beginPath(); ctx.arc(s.x,s.y,4*dpr,0,7); ctx.fill(); ctx.globalAlpha=1; });
  if(started){
    ctx.save(); ctx.translate(W*0.3,y);
    ctx.shadowColor="#22d3ee"; ctx.shadowBlur=40;
    const grd=ctx.createRadialGradient(0,0,2,0,0,22*dpr);
    grd.addColorStop(0,"#fff"); grd.addColorStop(.45,"#67e8f9"); grd.addColorStop(1,"#a855f7");
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(0,0,18*dpr,0,7); ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
resize(); stars=[...Array(80)].map(()=>({x:Math.random()*W,y:Math.random()*H,z:0.3+Math.random()})); loop();
addEventListener("resize", resize);
addEventListener("pointerdown", e=>{ e.preventDefault(); actx.resume(); boost(); }, {passive:false});
addEventListener("keydown", e=>{ if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); actx.resume(); boost(); }});
document.getElementById("go").onclick=()=>{ actx.resume(); reset(); };
document.getElementById("again").onclick=reset;
</script>
</body>
</html>
