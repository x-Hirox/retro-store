<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Neon Highway</title>
  <style>
    html,body{margin:0;height:100%;background:#05010f;overflow:hidden;touch-action:none;font-family:"Segoe UI",system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #ui{position:fixed;inset:0;pointer-events:none;color:#fff}
    #score{position:absolute;top:16px;left:18px;font-size:clamp(22px,5vw,36px);font-weight:800;text-shadow:0 0 18px #f59e0b}
    #ctrl{position:absolute;top:18px;right:16px;opacity:.7;font-size:13px;text-align:right}
    #start,#over{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(88,28,135,.35),rgba(5,1,15,.86))}
    #over{display:none} #over.show{display:grid} #start.hide{display:none}
    .box{text-align:center;padding:20px}
    h1{margin:0 0 8px;font-size:clamp(28px,7vw,48px);background:linear-gradient(90deg,#fde68a,#f472b6);-webkit-background-clip:text;color:transparent}
    p{opacity:.85;max-width:460px;margin:0 auto 18px;line-height:1.45}
    button{border:0;border-radius:999px;padding:14px 32px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(90deg,#f59e0b,#ef4444);cursor:pointer}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">0</div>
  <div id="ctrl">A D / ← → / Swipe</div>
  <div id="start"><div class="box">
    <h1>NEON HIGHWAY</h1>
    <p>კომპი: ისრები ან A/D. ტელეფონი: სრიალი ან ეკრანის მარცხენა/მარჯვენა მხარე. აირიდე ბარიერები 3D ტრასაზე.</p>
    <button id="go">თამაში</button>
  </div></div>
  <div id="over"><div class="box">
    <h1>CRASH</h1>
    <p id="final"></p>
    <button id="again">კიდევ</button>
  </div></div>
</div>
<script>
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"), startEl=document.getElementById("start");
const overEl=document.getElementById("over"), finalEl=document.getElementById("final");
let W,H,dpr,camZ,speed,curve,targetC,playerX,blocks,score,best,live,started,t,keys,sx;
best=+localStorage.getItem("rb_lane")||0;
const actx=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d){const o=actx.createOscillator(),g=actx.createGain();o.type="sawtooth";o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.stop(actx.currentTime+d);}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.width=innerWidth*dpr;H=canvas.height=innerHeight*dpr;}
function reset(){live=true;started=true;camZ=0;speed=180;curve=0;targetC=0;playerX=0;score=0;t=0;blocks=[]; for(let i=0;i<8;i++) spawn(800+i*700); scoreEl.textContent="0"; overEl.classList.remove("show"); startEl.classList.add("hide");}
function spawn(z){ const lane=[-1,0,1][Math.floor(Math.random()*3)]; blocks.push({z,lane,hit:false}); }
function project(x,y,z){
  const cz=z-camZ; if(cz<=20) return null;
  const s=420/cz; return {x:W/2+(x+curve*cz*cz*0.000002)*s, y:H*.38+y*s, s};
}
function die(){if(!live)return;live=false;beep(60,.4);best=Math.max(best,score);localStorage.setItem("rb_lane",best);finalEl.textContent=`ქულა ${score}  ·  რეკორდი ${best}`;overEl.classList.add("show");}
function loop(){
  t++;
  const sky=ctx.createLinearGradient(0,0,0,H*.42);
  sky.addColorStop(0,"#0b0524"); sky.addColorStop(1,"#4c1d95");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fde68a"; ctx.beginPath(); ctx.arc(W*.78,H*.12,H*.05,0,7); ctx.fill();
  if(live&&started){
    if(keys.left) playerX-=0.045; if(keys.right) playerX+=0.045;
    playerX=Math.max(-0.92,Math.min(0.92,playerX));
    speed=Math.min(340,180+score*0.8); camZ+=speed*0.016;
    curve+=(targetC-curve)*0.02; if(t%180===0) targetC=(Math.random()-.5)*1400;
    if(t%90===0) spawn(camZ+2800);
    if(t%5===0){score++; scoreEl.textContent=score;}
  }
  const roadW=1200;
  for(let i=40;i>=0;i--){
    const z1=camZ+i*70, z2=camZ+(i+1)*70;
    const p1=project(-roadW,0,z1), p2=project(roadW,0,z1), p3=project(roadW,0,z2), p4=project(-roadW,0,z2);
    if(!p1||!p2||!p3||!p4) continue;
    ctx.fillStyle=i%2? "#1e1b4b":"#312e81";
    ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y); ctx.fill();
    const rumble=i%2?"#f43f5e":"#fff";
    ctx.fillStyle=rumble;
    const l1=project(-roadW,0,z1), l2=project(-roadW-80,0,z1), l3=project(-roadW-80,0,z2), l4=project(-roadW,0,z2);
    const r1=project(roadW,0,z1), r2=project(roadW+80,0,z1), r3=project(roadW+80,0,z2), r4=project(roadW,0,z2);
    if(l1&&l2&&l3&&l4){ctx.beginPath();ctx.moveTo(l1.x,l1.y);ctx.lineTo(l2.x,l2.y);ctx.lineTo(l3.x,l3.y);ctx.lineTo(l4.x,l4.y);ctx.fill();}
    if(r1&&r2&&r3&&r4){ctx.beginPath();ctx.moveTo(r1.x,r1.y);ctx.lineTo(r2.x,r2.y);ctx.lineTo(r3.x,r3.y);ctx.lineTo(r4.x,r4.y);ctx.fill();}
  }
  blocks.forEach(b=>{
    const x=b.lane*420, p=project(x,-40,b.z);
    if(!p) return;
    const w=p.s*140, h=p.s*110;
    ctx.fillStyle="#fb7185"; ctx.shadowBlur=18; ctx.shadowColor="#f43f5e";
    ctx.fillRect(p.x-w/2, p.y-h, w, h);
    ctx.shadowBlur=0; ctx.fillStyle="#fff"; ctx.fillRect(p.x-w*.15,p.y-h*.7,w*.3,h*.2);
    if(live && Math.abs(b.z-camZ-220)<40 && Math.abs(playerX - b.lane*0.62)<0.38) die();
  });
  blocks=blocks.filter(b=>b.z>camZ+40);
  if(started){
    const carY=H*.78, carX=W/2+playerX*W*.28;
    ctx.shadowBlur=24; ctx.shadowColor="#f59e0b";
    ctx.fillStyle="#fde68a";
    ctx.beginPath(); ctx.moveTo(carX,carY-54); ctx.lineTo(carX+36,carY+18); ctx.lineTo(carX-36,carY+18); ctx.fill();
    ctx.fillStyle="#0f172a"; ctx.fillRect(carX-14,carY-28,28,22);
    ctx.fillStyle="#22d3ee"; ctx.fillRect(carX-22,carY+10,16,8); ctx.fillRect(carX+6,carY+10,16,8);
    ctx.shadowBlur=0;
  }
  requestAnimationFrame(loop);
}
keys={left:false,right:false};
resize(); loop();
addEventListener("resize", resize);
addEventListener("keydown", e=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=true;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=true;
  if(e.code==="Space"&&!started){actx.resume();reset();}
});
addEventListener("keyup", e=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=false;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=false;
});
addEventListener("pointerdown", e=>{ sx=e.clientX; actx.resume(); if(!started) reset(); }, {passive:true});
addEventListener("pointerup", e=>{
  if(!started) return;
  const dx=e.clientX-sx;
  if(Math.abs(dx)>24) playerX=Math.max(-.92,Math.min(.92,playerX+(dx>0?.55:-.55)));
  else playerX=Math.max(-.92,Math.min(.92,playerX+(e.clientX<innerWidth/2?-.55:.55)));
}, {passive:true});
document.getElementById("go").onclick=()=>{actx.resume();reset();};
document.getElementById("again").onclick=reset;
</script>
</body>
</html>
