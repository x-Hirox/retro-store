<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroBit Arcade</title>
    <style>
      html,
      body,
      #player {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #050508;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const rom = params.get("rom") || "";
      const core = params.get("core") || "nes";
      const name = params.get("name") || "RetroBit Arcade";
      if (!rom) {
        document.body.innerHTML =
          '<p style="color:#fff;font-family:sans-serif;padding:24px">ROM ვერ მოიძებნა.</p>';
      } else {
        window.EJS_player = "#player";
        window.EJS_core = core;
        window.EJS_gameUrl = rom;
        window.EJS_gameName = name;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_color = "#9328e6";
        window.EJS_backgroundColor = "#050508";
        const script = document.createElement("script");
        script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
